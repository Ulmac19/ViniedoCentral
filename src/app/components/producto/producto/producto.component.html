<article class="card" (click)="verDetalle.emit(product)">
  <div class="image-container">
    <img [src]="product.imageUrl" [alt]="product.name" />
  </div>

  <div class="body">
    <h3 class="title">{{ product.name }}</h3>
    <span class="price">{{ product.price | currency:'MXN' }}</span>

    <div class="card-add-controls" (click)="$event.stopPropagation()">
      @if (product.inStock) {
        <input type="number" class="qty-input" min="1" [max]="product.stock" value="1" #cantidadInput (input)="onCantidadChange(cantidadInput.value)">
        <button class="add-btn" (click)="onAdd(cantidadInput.value)" [disabled]="!cantidadValida()">
          <i class="fas fa-cart-plus"></i> Añadir
        </button>
      } @else {
        <span class="agotado-badge"><i class="fas fa-times-circle"></i> Agotado</span>
      }
    </div>
  </div>
</article>
